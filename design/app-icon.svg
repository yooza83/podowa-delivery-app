<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9333ea"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <radialGradient id="grape" cx="0.35" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="0.55" stop-color="#9333ea"/>
      <stop offset="1" stop-color="#6b21a8"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
  </defs>

  <!-- 배경: 꽉 찬 정사각형(둥근 모서리 없음) — iOS/Android가 각자 알아서 마스킹함 -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>

  <!-- 줄기 + 덩굴손 -->
  <path d="M256 150 C 250 120, 262 100, 250 78" fill="none" stroke="#5b3a29" stroke-width="9" stroke-linecap="round"/>
  <path d="M250 78 C 240 66, 246 52, 236 44" fill="none" stroke="#5b3a29" stroke-width="7" stroke-linecap="round"/>

  <!-- 잎 -->
  <path d="M256 150 C 210 140, 176 100, 190 56 C 234 60, 264 96, 256 150 Z" fill="url(#leaf)"/>
  <path d="M198 66 C 220 84, 238 112, 248 142" fill="none" stroke="#15803d" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

  <!-- 포도알 (위에서 아래로 좁아지는 삼각 배열) -->
  <g>
    <circle cx="178" cy="206" r="40" fill="url(#grape)"/>
    <circle cx="236" cy="196" r="40" fill="url(#grape)"/>
    <circle cx="294" cy="196" r="40" fill="url(#grape)"/>
    <circle cx="350" cy="210" r="40" fill="url(#grape)"/>

    <circle cx="204" cy="270" r="40" fill="url(#grape)"/>
    <circle cx="262" cy="262" r="40" fill="url(#grape)"/>
    <circle cx="320" cy="272" r="40" fill="url(#grape)"/>

    <circle cx="228" cy="334" r="40" fill="url(#grape)"/>
    <circle cx="288" cy="336" r="40" fill="url(#grape)"/>

    <circle cx="258" cy="396" r="40" fill="url(#grape)"/>

    <!-- 광택 하이라이트 -->
    <g fill="#f5e8ff" opacity="0.55">
      <ellipse cx="166" cy="193" rx="10" ry="7"/>
      <ellipse cx="224" cy="183" rx="10" ry="7"/>
      <ellipse cx="282" cy="183" rx="10" ry="7"/>
      <ellipse cx="338" cy="197" rx="10" ry="7"/>
      <ellipse cx="192" cy="257" rx="10" ry="7"/>
      <ellipse cx="250" cy="249" rx="10" ry="7"/>
      <ellipse cx="308" cy="259" rx="10" ry="7"/>
      <ellipse cx="216" cy="321" rx="10" ry="7"/>
      <ellipse cx="276" cy="323" rx="10" ry="7"/>
      <ellipse cx="246" cy="383" rx="10" ry="7"/>
    </g>
  </g>

  <!-- 배송 경로 표시(살짝 포인트만) -->
  <path d="M150 452 C 200 470, 312 470, 362 452" fill="none" stroke="#f5e8ff" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 16" opacity="0.85"/>
  <path d="M256 402 L256 452" fill="none" stroke="#f5e8ff" stroke-width="0" opacity="0"/>
  <path d="M362 452 c0 12 -10 24 -18 32 c-8 -8 -18 -20 -18 -32 a18 18 0 1 1 36 0 Z" fill="#f5e8ff"/>
  <circle cx="344" cy="452" r="6.5" fill="#7e22ce"/>
</svg>

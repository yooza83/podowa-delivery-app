<!doctype html>
<html lang="ko" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 실제 내용은 한국어인데 lang="en"으로 잘못 표시돼 있으면 모바일 브라우저가
         "번역이 필요한 페이지"로 오인해 자동번역을 걸어 어색한 문구로 덮어써버린다.
         lang="ko" + notranslate로 이 문제를 막는다. -->
    <meta name="google" content="notranslate" />
    <title>포도와농장 배송앱</title>

    <!-- 앱 아이콘 (브라우저 탭 + 홈 화면 추가용) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#7c3aed" />

    <!-- iOS: 홈 화면에서 열었을 때 브라우저 주소창 없이 앱처럼 보이게 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="포도와농장" />
    <!-- Android(구형 브라우저 호환) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <!--
      TMap JS SDK: 빌드 타임에 심어지는 '공개용' 지도 키(VITE_TMAP_JS_APP_KEY, frontend/.env).
      일반 <script> 태그(async/defer 없음)로 HTML 파싱 중 바로 실행되게 해야 한다 —
      이 SDK가 내부적으로 document.write()로 하위 리소스를 불러오는데, 나중에 JS로
      동적 삽입하면 브라우저가 이를 막아버린다(async 스크립트의 document.write 제한).
    -->
    <script src="https://apis.openapi.sk.com/tmap/jsv2?version=1&appKey=%VITE_TMAP_JS_APP_KEY%"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
